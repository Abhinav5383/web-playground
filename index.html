	<style>
		:root {
			color-scheme: dark;
		}

		li {
			list-style-position: inside;
			margin-inline-start: 2em;
			color: lch(85% 50% calc(sibling-index() * (360deg / sibling-count())));

			a {
				color: inherit;
				font-size: 1.3rem;
				text-decoration-color: lch(from currentColor l c h / 0.5);
				text-underline-offset: 0.15em;
				transition: color 0.2s;
			}

			a:hover, a:focus-visible {
				color:  white;
			}
		}
	</style>
</head>
