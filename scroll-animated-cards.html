<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Scroll Cards</title>

	<link rel="stylesheet" href="global.css">
	<style>
		body {
			background: #050816;
			opacity: 0;
			interactivity: inert;
		}

		main {
			position: relative;
			display: grid;
		}

		section {
			min-height: 100svb;
			display: grid;
			place-content: center;
			outline: 0.1em dashed #fff8;
			outline-offset: -0.5rem;

			&:not(:first-child) {
				z-index: 5;
			}
		}

		.hero {
			position: sticky;
			inset-block-start: 0;
			gap: 1rem;
			background:
				radial-gradient(circle at 50% 35%, #24304f 0%, transparent 55%),
				linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent);

			h1 {
				width: fit-content;
				margin: 0;
				font-size: 4rem;
				position: relative;
				isolation: isolate;
				transition: all 300ms;
			}

			h1::after {
				content: "";
				position: absolute;
				background-color: white;
				inset: 0;
				inset-block-start: calc(100% - 0.05em);
				transition: all 300ms;
				z-index: -1;
			}

			h1:hover {
				color: black;
			}

			h1:hover::after {
				inset-block-start: 0;
			}

			span {
				text-align: center;
				color: #9098ac;
			}
		}

		.cards-section {
			background-image: radial-gradient(circle at top,
					#1b2338 0%,
					#0b1020 42%,
					#050816 100%);
			display: grid;
			grid-template-columns: 1fr;
			grid-template-rows: repeat(3, 1fr);
			position: relative;

			.sticky-box {
				min-height: 100svb;
				display: grid;
				place-content: center;
				inset-block-start: 0;
				position: sticky;
				container-type: inline-size;
			}
		}

		@property --roundness {
			syntax: "<number>";
			inherits: true;
			initial-value: 0;
		}

		.sticky-box .cards {
			display: grid;
			grid-template-columns: repeat(3, 1fr);

			--radius-full: 1rem;

			.front,
			.back {
				border-radius: calc(var(--radius-full) * var(--roundness));
			}

			> :first-child .front,
			> :last-child .back {
				border-start-start-radius: var(--radius-full);
				border-end-start-radius: var(--radius-full);
			}

			> :last-child .front,
			> :first-child .back {
				border-start-end-radius: var(--radius-full);
				border-end-end-radius: var(--radius-full);
			}
		}

		.sticky-box .card {
			width: clamp(4vw, 20vw, 15rem);
			aspect-ratio: 3 / 5;

			position: relative;
			display: grid;
			grid-template: 1fr / 1fr;
			transform-style: preserve-3d;

			.front,
			.back {
				grid-row: 1 / -1;
				grid-column: 1 / -1;
				display: grid;
				place-content: center;
				backface-visibility: hidden;
				overflow: clip;
			}

			.front {
				font-size: clamp(2rem, 8vw, 4rem);
				font-weight: 600;
				background: linear-gradient(in oklch,
						lch(65% 50% var(--hue, 0)),
						lch(45% 50% var(--hue, 0)));
				color: color-mix(in oklch, white 70%, lch(65% 50% var(--hue, 0)));
			}

			.back {
				display: grid;
				background-color: teal;
				transform: rotateY(180deg);
				position: relative;

				grid-template: 1fr / 1fr;

				>* {
					grid-column: 1 / -1;
					grid-row: 1 / -1;
				}

				div.img {
					background-image: var(--bg);
					background-size: cover;
					background-position: 50% 50%;

					transition: all 300ms;
					filter: brightness(100%);
				}

				span {
					padding: 0.5rem 1rem;
					font-size: clamp(1.17rem, 4vw, 2rem);
					color: #ABCD;
					font-weight: 600;
					place-self: end center;
					transform: translateY(200%);
					transition: transform 300ms;
				}

				&:hover {
					div.img {
						filter: brightness(75%);
						scale: 1.1;
					}

					span {
						transform: translateY(0);
					}
				}
			}
		}

		footer {
			padding: 1rem 2rem;
			text-align: center;
			align-content: center;
			background-color: tomato;
		}
	</style>

</head>

<body>

	<main>
		<section class="hero">
			<h1>Hero Section</h1>
			<span>Scroll to see some cards flip &#x2193;</span>
		</section>

		<section class="cards-section">
			<div class="sticky-box">
				<div class="cards">
					<div class="card-hitbox">
						<div class="card" style="--hue: 0deg;">
							<div class="front">1</div>
							<div class="back">
								<div class="img" style="--bg: url('https://picsum.photos/id/696/400/600');"></div>
								<span>Card 1</span>
							</div>
						</div>
					</div>

					<div class="card-hitbox">
						<div class="card" style="--hue: 220deg;">
							<div class="front">2</div>
							<div class="back">
								<div class="img" style="--bg: url('https://picsum.photos/id/446/400/600');"></div>
								<span>Card 2</span>
							</div>
						</div>
					</div>

					<div class="card-hitbox">
						<div class="card" style="--hue: 320deg;">
							<div class="front">3</div>
							<div class="back">
								<div class="img" style="--bg: url('https://picsum.photos/id/296/400/600');"></div>
								<span>Card 3</span>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div class="split-trigger"></div>
		</section>

		<section class="idk">
			Something at the end :P
		</section>
	</main>

	<footer>Da &lt;footer&gt;</footer>


	<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollSmoother.min.js"></script>

	<script>
		window.addEventListener("load", main);

		function main() {
			gsap.registerPlugin(ScrollTrigger, ScrollSmoother);

			gsap.to("body", {
				interactivity: "inherit",
				opacity: 1,
				duration: 0.2
			})

			gsap.fromTo(".hero", {
				opacity: 1
			}, {
				opacity: 0,
				scrollTrigger: {
					trigger: ".cards-section",
					start: "top bottom",
					end: "top 75%",
					scrub: 0.7
				}
			});

			gsap.to(".cards", {
				gap: "2rem",
				"--roundness": 1,
				scrollTrigger: {
					trigger: ".cards",
					start: "top 90%",
					end: "center center",
					scrub: 0.7
				}
			});

			gsap.to(".card", {
				transform: "rotateY(180deg)",
				scrollTrigger: {
					trigger: ".split-trigger",
					scrub: 0.7
				}
			});
		}
	</script>
</body>

</html>
