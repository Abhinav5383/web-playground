<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Morphing Popup</title>
	<link rel="stylesheet" href="https://necolas.github.io/normalize.css/8.0.1/normalize.css">

	<style>
		:root {
			color-scheme: dark;
			interpolate-size: allow-keywords;
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		main {
			padding: 4em;
			display: grid;
			place-content: center;
		}

		button {
			border: none;
			outline: none;
			font-size: 1.3rem;
			white-space: nowrap;
			anchor-name: --popover-1;

			--bg: lch(50% 50% 220deg);
			background: var(--bg);
			height: 2.5em;
			padding: 0.5em 1em;
			border-radius: 0.3em;
			cursor: pointer;
			box-shadow: -0.2em -0.2em 0 lch(from var(--bg) calc(l * 0.7) c h);
			transition: filter 0.25s ease, box-shadow 0.25s ease, opacity 0.2s ease;

			&:hover, &:focus-visible {
				filter: brightness(90%);
			}
			
			&:active {
				box-shadow: -0.1em -0.1em 0 lch(from var(--bg) calc(l * 0.7) c h);
			}
		}

		[popover] {
			--bg: lch(60% 40% 150deg);
			background-image: linear-gradient(315deg, var(--bg), lch(from var(--bg) calc(l * 1.2) c h));
			color: lch(from var(--bg) calc(l * 0.5) c h);
			border: 4px solid lch(from var(--bg) calc(l * 0.5) c h);
			border-radius: 0.4rem;
			overflow: clip;

			inset: unset;
			position-anchor: --popover-1;
			inset-block-start: calc((anchor(start) + anchor(end)) * 0.5);
			inset-inline-start: calc((anchor(start) + anchor(end)) * 0.5);
			inline-size: anchor-size(self-inline);
			block-size: anchor-size(self-block);

			translate: -50% -50%;
			opacity: 0.5;

			--duration: .5s;
			--delay: .1s;
			transition: inset-block-start var(--duration) 0s, inset-inline-start var(--duration) 0s, inline-size, block-size, display, opacity;
			transition-delay: var(--delay);
			transition-duration: var(--duration);
			transition-timing-function: linear(0, 0.354 7.4%, 0.628 15.3%, 0.827 23.8%, 0.902 28.4%, 0.959 33.2%, 1.02 41.8%, 1.044 51.9%, 1.04 61%, 1.005 85.3%, 1);
			transition-behavior: allow-discrete;
		}
		
		[popover]:popover-open {
			opacity: 1;
			inset-block-start: 50%;
			inset-inline-start: 50%;
			inline-size: min-content;
			block-size: auto;
			transition: inset-block-start var(--duration) var(--delay), inset-inline-start var(--duration) var(--delay), inline-size, block-size, display, opacity;
			transition-duration: var(--duration);
			transition-delay: 0s;
			transition-timing-function: linear(0, 0.354 7.4%, 0.628 15.3%, 0.827 23.8%, 0.902 28.4%, 0.959 33.2%, 1.02 41.8%, 1.044 51.9%, 1.04 61%, 1.005 85.3%, 1);
			
			@starting-style {
				inset-block-start: calc((anchor(start) + anchor(end)) * 0.5);
				inset-inline-start: calc((anchor(start) + anchor(end)) * 0.5);
				inline-size: anchor-size(self-inline);
				block-size: anchor-size(self-block);
				opacity: 0.5;
			}
		}

		[popover] .content {
			padding: 2rem;
			inline-size: calc(min(100vw, 64ch) - 2rem);

			h2 {
				font-size: 3rem;
				margin-block-end: 0.5em;
				text-shadow: -1.5px -1px 0 lch(from currentColor calc(l * 1.6) c h);
			}

			& > * {
				opacity: 0;
				transition: opacity 0.3s ease;
			}
		}

		[popover]:popover-open .content > * {
			opacity: 1;
			transition: opacity 0.3s calc(var(--delay) + 0.1s) ease;

			@starting-style {
				opacity: 0;
			}
		}
	</style>
</head>
<body>

	<main>
		<button class="trigger" popovertarget="the-popover">
			Open Popup +
		</button>

		<div id="the-popover" popover="hint">
			<div class="content">
				<h2>A Popover</h2>
				<p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Ad veniam delectus iusto aspernatur, repudiandae dolores nostrum mollitia est quia ipsa, perferendis doloribus molestiae nam velit doloremque illo ipsam voluptate ullam.</p>
			</div>
		</div>
	</main>
	
</body>
</html>
